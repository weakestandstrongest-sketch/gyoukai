name: Update data

on:
  schedule:
    # 日本時間 5:40 / 12:10 / 15:50 / 17:40 / 21:10（決算短信は15時以降に多く出る）
    - cron: "40 20 * * *"
    - cron: "10 3 * * *"
    - cron: "50 6 * * *"
    - cron: "40 8 * * *"
    - cron: "10 12 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install xlrd==2.0.1 openpyxl==3.1.5
      - name: 全上場企業の一覧
        run: python scripts/build_companies.py
        continue-on-error: true
      - name: 今日のニュース
        run: python scripts/build_news.py
        continue-on-error: true
      - name: 決算短信（TDnet）
        run: python scripts/build_financials.py
        continue-on-error: true
      - name: 決算発表予定日
        run: python scripts/build_calendar.py
        continue-on-error: true
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "データを更新（$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')）"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
