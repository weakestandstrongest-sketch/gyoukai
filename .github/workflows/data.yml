name: Update data

on:
  schedule:
    - cron: "40 20 * * *"   # 毎朝 5:40（日本時間）
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install xlrd==2.0.1
      - name: 全上場企業の一覧
        run: python scripts/build_companies.py
        continue-on-error: true
      - name: 今日のニュース
        run: python scripts/build_news.py
        continue-on-error: true
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "データを更新（$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')）"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
